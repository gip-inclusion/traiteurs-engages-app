{% macro confirm_dialog(id, title, message, action_url, action_label="Confirmer", destructive=False) %}
<div id="{{ id }}" class="fixed inset-0 z-50 hidden items-center justify-center p-4"
     style="background-color:rgba(0,0,0,0.5);" data-backdrop-dismiss>
  <div class="bg-white rounded-xl shadow-2xl w-full flex flex-col" style="max-width:440px;">

    <div class="flex items-start justify-between gap-3 p-6 border-b" style="border-color:var(--c-border-soft);flex-shrink:0;">
      <div class="flex items-center gap-3" style="min-width:0;">
        <div class="rounded-full flex items-center justify-center"
             style="width:2.5rem;height:2.5rem;flex-shrink:0;
                    background-color:{% if destructive %}#FEF2F2{% else %}#F0F4F8{% endif %};">
          <i data-lucide="{% if destructive %}alert-triangle{% else %}help-circle{% endif %}"
             style="width:20px;height:20px;color:{% if destructive %}#DC2626{% else %}#1A3A52{% endif %};"></i>
        </div>
        <h3 class="font-display font-bold text-lg text-black">{{ title }}</h3>
      </div>
      <button type="button" data-action="dialog-close" data-target="{{ id }}"
              class="text-mute-soft hover:text-black transition-colors" style="flex-shrink:0;"
              aria-label="Fermer">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>


    <div class="p-6">
      <p class="text-sm text-text-soft" style="line-height:1.625;">{{ message }}</p>
    </div>


    <div class="flex items-center gap-2 p-6 border-t" style="border-color:var(--c-border-soft);flex-shrink:0;">
      <button type="button" data-action="dialog-close" data-target="{{ id }}"
              class="flex-1 px-4 py-2.5 rounded-full text-xs font-bold transition-colors btn-ghost-navy">
        Annuler
      </button>
      <form method="POST" action="{{ action_url }}" class="flex-1">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit"
                class="w-full px-4 py-2.5 rounded-full text-xs font-bold text-white transition-opacity hover:opacity-90"
                style="background-color:{% if destructive %}var(--c-danger){% else %}var(--c-navy){% endif %};">
          {{ action_label }}
        </button>
      </form>
    </div>
  </div>
</div>
{% endmacro %}
